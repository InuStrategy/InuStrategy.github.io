name: Publish InuStrategy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Validate frontend and accounting
        working-directory: site
        run: |
          npm run check
          npm test
      - name: Generate read-only blockchain snapshot
        working-directory: site
        env:
          SOLSCAN_API_KEY: ${{ secrets.SOLSCAN_API_KEY }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          TOKEN_DATA_URL: ${{ secrets.TOKEN_DATA_URL }}
          FEE_INDEXER_URL: ${{ secrets.FEE_INDEXER_URL }}
          TOKEN_CA: ${{ vars.TOKEN_CA }}
          FEE_RECIPIENT: ${{ vars.FEE_RECIPIENT }}
          FEE_SOURCES: ${{ vars.FEE_SOURCES }}
          DISTRIBUTION_WALLET: ${{ vars.DISTRIBUTION_WALLET }}
          DISTRIBUTION_ASSET_MINT: ${{ vars.DISTRIBUTION_ASSET_MINT }}
          DISTRIBUTION_ASSET_SYMBOL: ${{ vars.DISTRIBUTION_ASSET_SYMBOL }}
          DISTRIBUTION_INDEXER_URL: ${{ secrets.DISTRIBUTION_INDEXER_URL }}
        run: |
          npm run build
          node scripts/test-token.mjs
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy homepage
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
