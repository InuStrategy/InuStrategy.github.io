name: Publish InuStrategy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install locked dependencies
        working-directory: site
        run: npm ci
      - name: Validate frontend and ICP data adapter
        working-directory: site
        run: |
          npm run check
          npm test
      - name: Generate read-only blockchain snapshot
        working-directory: site
        env:
          ICP_LEDGER_CANISTER_ID: ${{ vars.ICP_LEDGER_CANISTER_ID }}
          ICP_MARKET_CANISTER_ID: ${{ vars.ICP_MARKET_CANISTER_ID }}
          ICP_POOL_CANISTER_ID: ${{ vars.ICP_POOL_CANISTER_ID }}
        run: |
          npm run build
          node scripts/test-token.mjs
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy homepage
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
